version: '3.8'

services:
  hemix-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemix-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=${DATABASE_URL:-data/hemix.db}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://agentrouter.org/v1}
      - AI_MODEL=${AI_MODEL:-auto}
      - OWNER_NUMBER=${OWNER_NUMBER}
      - BOT_PREFIX=${BOT_PREFIX:-.}
      - BOT_MODE=${BOT_MODE:-private}
      - BOT_NAME=${BOT_NAME:-Hemix}
      - OWNER_NAME=${OWNER_NAME:-Owner}
      - TIMEZONE=${TIMEZONE:-Asia/Karachi}
      - LOG_LEVEL=${LOG_LEVEL:-info}
